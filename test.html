
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 확인</title>
</head>
<body>
    <input id="price" type="number" placeholder="가격(만원)">
    <button id="checkBtn">확인</button>
    
    <p id="result">가격을 입력해 주세요.</p>

    <script>
        const priceInput = document.querySelector("#price");
        const button = document.querySelector("#checkBtn");
        const result = document.querySelector("#result");

        button.addEventListener("click", function () {
            // 가격 입력 여부 확인
            if (priceInput.value.trim() === "") {
                result.textContent = "가격을 입력하세요.";
                return;
            }

            // 입력값을 숫자로 변환
            const price = Number(priceInput.value);

            // 음수 입력 방지
            if (price < 0) {
                result.textContent = "0 이상의 값을 입력하세요.";
                return;
            }

            // 입력한 가격 출력
            result.textContent = price + "만원을 입력했습니다.";
        });
    </script>
</body>
</html>
